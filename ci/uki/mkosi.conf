# A bootable self-check for the claims a container cannot test.
#
# Three things in this repository are about the KERNEL: that the BPF LSM
# attaches and denies, that a namespace with no route is the primary control,
# and that a key seals against measured state in a real TPM. A container shares
# the host kernel and cannot hold CAP_SYS_ADMIN, so those tests skip there.
# This boots on the metal, runs them, prints one screen and stops.

[Distribution]
Distribution=arch

[Output]
Format=uki
ImageId=arazu-coldrun

[Content]
# RUNTIME packages only. The target ESP has 438MB free beside two existing
# UKIs, so every megabyte here is a megabyte that decides whether this can be
# dropped in /boot/EFI/Linux instead of carried on a USB stick. clang, make and
# bpftool are build-time only: nothing at boot compiles anything.
# SIZE IS A BOOT CONSTRAINT, not a preference. Firmware loads the whole UKI into
# memory before executing it; at 1.1GB (linux-firmware plus the Go toolchain)
# OVMF could read the ESP and still would not load the image. Keep this small.
#
# Dropping linux-firmware means NICs needing a firmware blob (most Realtek, all
# Wi-Fi) will not come up. Intel wired parts, which is what this is booted on,
# do not need one. The self-check reports the control probe's verdict by name,
# so a machine with no link fails loudly rather than passing quietly.
#
# Dropping the Go toolchain costs the `go test ./...` section, which is the one
# part already proven on a clean container. What only bare metal can test — LSM
# attach, namespace denial, TPM — runs from prebuilt binaries.

# lsm=...,bpf is LOAD-BEARING. CONFIG_BPF_LSM=y only makes the hook available;
# the LSM has to be in the ACTIVE list at boot or the program cannot attach and
# every containment check fails for a reason that has nothing to do with the
# code. This mirrors the development host's own cmdline.
#
# CONSOLE ORDER MATTERS AND THE LAST ONE WINS. Every console= receives kernel
# printk, but the LAST one becomes /dev/console, which is where systemd and the
# self-check write. With ttyS0 last, a machine with no serial port shows the
# kernel's first few lines and then nothing: the boot is fine and the output is
# going to a port that does not exist. tty0 is last so the screen is primary.
#
# This was verified in QEMU over the serial console — the one console the target
# machine does not have — so the test passed on the exact variable that was
# wrong. ttyS0 is kept first so a future VM run can still capture output.
#
# show_status=yes rather than rd.systemd.show_status=false: if this stalls, the
# unit it is waiting on should be on the screen rather than suppressed.
KernelCommandLine=lsm=landlock,lockdown,yama,integrity,apparmor,bpf
                  console=ttyS0,115200
                  console=tty0
                  systemd.log_level=info
                  systemd.show_status=yes

# tar, make, clang and bpftool are RUNTIME packages in this variant, unlike the
# self-check where the note above calls them build-time only. That note is right
# about the self-check and wrong about this image: coldrun unpacks a tarball and
# runs `make build` against it, which is the whole tier-1 claim. Without them the
# first cold boot said "tar: command not found", then "make: command not found",
# and tier 1 collapsed into a cascade of empty variables.
#
# `make build` reaches bpf/vmlinux.h, which the Makefile generates by dumping
# /sys/kernel/btf/vmlinux through bpftool. The header is gitignored, so it is
# not in the export tarball and MUST be regenerated on the machine doing the
# build. That is correct rather than a workaround: the program is CO-RE and
# should be built against the BTF of the kernel it will load on.
Packages=linux
         go
         git
         tar
         make
         clang
         bpf
         podman
         fuse-overlayfs
         jq
         systemd
         systemd-resolvconf
         iputils
         bash
         coreutils
         iproute2
         util-linux
         python
         python-yaml
         tpm2-tools
         gawk
         grep
         sed
         procps-ng

# The repo is built INTO the image rather than at boot: a self-check that
# spends two minutes compiling before it says anything is one nobody waits for.
BuildPackages=go
              clang
              bpf
              make
              git

[Validation]
# Secure Boot is disabled on the target, so the UKI is unsigned. Stated rather
# than left implicit: on a machine with Secure Boot ON this will not boot until
# the key is enrolled.
SecureBoot=no

[Build]
# SRCDIR is the directory holding this config, i.e. ci/uki, NOT the repo root:
# the first build failed with "cannot stat /work/src/scripts". The repository is
# mounted explicitly, and the target is RELATIVE to SRCDIR, so it lands at
# $SRCDIR/repo rather than at an absolute /repo.
BuildSources=../..:repo

# USB NICs and the USB host controllers they hang off. mkosi ships a filtered
# set of kernel modules, and for a UKI the initrd IS the root filesystem, so a
# module that is not included does not exist at runtime — the interface never
# appears and the control probe has nothing to reach the network through.
#
# The whole of drivers/net, not a list of subdirectories. The first attempt
# named usb/, ethernet/ and phy/ and missed drivers/net/virtio_net.ko, which
# sits directly in drivers/net — that would have broken the QEMU test path
# while looking like a targeted improvement.
#
# NOTE: KernelModulesInclude REPLACES mkosi's default set rather than adding to
# it, so anything not matched here is gone. TPM, xHCI and virtio_blk are safe
# because the Arch kernel builds them in (CONFIG_TCG_TPM=y, CONFIG_TCG_CRB=y),
# which is also why the TPM worked on the metal.
#
# THE FILESYSTEMS ARE NOT BUILT IN. The note above checked TPM and xHCI and
# stopped there; CONFIG_VFAT_FS, CONFIG_EXFAT_FS and CONFIG_OVERLAY_FS are all
# =m on Arch. Without these four lines the image carried 1126 driver modules and
# not one filesystem, so it could mount neither the results stick nor the ESP.
# Nothing caught it because ext4 and btrfs ARE builtin, so every developer-box
# path worked. exfat is what Ventoy formats its data partition as; fat is the
# ESP and most plain USB sticks; overlay is what podman's storage driver needs.
# fuse and nls_cp437 are builtin here, so they need no line.
KernelModulesInclude=drivers/net/.*
                     drivers/usb/.*
                     drivers/hid/.*
                     drivers/nvme/.*
                     fs/fat/.*
                     fs/exfat/.*
                     fs/nls/.*
                     fs/overlayfs/.*

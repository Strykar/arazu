# Wait for ANY interface, briefly, rather than for every one indefinitely.
#
# The default waits for all managed links to be configured and stalls the boot
# for a minute on a machine with a port that will never come up. The control
# probe reports its own verdict by name, so a genuinely dead network fails
# loudly a few lines later rather than silently here.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=20
